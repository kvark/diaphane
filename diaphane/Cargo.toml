[package]
name = "diaphane"
description = "Real-time 3D electrodynamics: a GPU FDTD solver you watch rather than post-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["science", "simulation", "graphics"]

[features]
default = []
serde = ["dep:serde", "dep:ron"]

[dependencies]
blade-graphics.workspace = true
blade-macros.workspace = true
bytemuck.workspace = true
log.workspace = true
ron = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The only 3D FDTD solver published on crates.io, and so the ecosystem baseline
# the `ecosystem` benchmark measures against.
# Its default feature set is the only one that builds: the prelude reaches for
# modules that a narrower selection configures out.
oxiphoton = "0.1"

[lints]
workspace = true

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "ecosystem"
harness = false

