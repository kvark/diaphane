name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup component add rustfmt clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (with software Vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lavapipe gives us a real Vulkan device on a headless runner, so the
      # GPU solver and the offscreen renderer are exercised for real in CI
      # rather than merely compiled.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-features --release
      - name: Render a frame offscreen
        # Exercises the whole render path -- pipelines, the auto-range
        # reduction, and the readback -- on a runner with no display.
        run: |
          cargo run --release -p diaphane-viz -- \
            --frames 1 --extent 64 --warmup 110 --steps 10 \
            --size 480x360 --mode electric --timeline --output-dir frames

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --all-features
