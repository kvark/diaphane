name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup component add rustfmt clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Blade selects its backend by target, so the Metal path is never
      # compiled on Linux -- and it differs enough to break: a pipeline
      # context there carries a `Drop` that holds a borrow, which turns code
      # Vulkan accepts into an error. Cross-checking takes twenty seconds here
      # and turns a several-minute wait on a macOS runner into part of lint.
      - name: Install the macOS target
        run: rustup target add aarch64-apple-darwin
      - name: Cross-check the Metal backend
        run: cargo clippy --all-targets --all-features
             --target aarch64-apple-darwin -- -D warnings

  test:
    name: Test (with software Vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lavapipe gives us a real Vulkan device on a headless runner and Xvfb
      # gives us a real X11 display, so the GPU solver, the offscreen renderer
      # *and* the windowed viewer are all exercised for real here rather than
      # merely compiled.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 \
            xvfb libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxcb-xkb1
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-features --release

      # The solver half has to stay usable without a window system, and the
      # only way that stays true is checking it. `--all-features` rather than
      # `--no-default-features` is the point: the visualizer is an example, so
      # `winit`, `png` and the whole egui stack are dev-dependencies, so there
      # is no feature anyone can turn on that puts a window system or a UI
      # toolkit into a graph depending on this crate. `--all-features` is also
      # what docs.rs builds with.
      - name: Check that the library is still headless
        run: |
          cargo build --no-default-features
          ! cargo tree --all-features -e normal | grep -qE '\bwinit\b|\bpng\b|\begui\b'

      - name: Render an animation offscreen
        # Exercises the GIF encoder as well as the render path, since the
        # README's animation is made by exactly this command.
        run: |
          cargo render --frames 4 --extent 48 --steps 5 --size 240x180 \
            --gif frames/motion.gif

      - name: Render a frame offscreen
        # The whole render path: pipelines, the auto-range reduction, the
        # scrub bar, and the readback -- with no display involved at all.
        run: |
          cargo render --frames 1 --extent 64 --warmup 110 --steps 10 \
            --size 480x360 --mode electric --timeline --output-dir frames

      - name: Smoke-test the windowed viewer under Xvfb
        # The event loop, surface creation, swapchain acquire and present --
        # everything the offscreen path deliberately does not touch. Without
        # this the viewer is the one component that only ever runs on a
        # developer's machine.
        run: |
          xvfb-run -a --server-args="-screen 0 800x600x24" \
            cargo viz --extent 48 --steps 4 --exit-after 20 --size 480x360 \
            | tee /tmp/viz.log
          # A panel that silently stops drawing looks exactly like one that is
          # drawing correctly, from out here. Nothing under a virtual display
          # would notice, so the primitive count is the assertion.
          grep -qE 'panel primitives' /tmp/viz.log
          ! grep -qE '0 panel primitives' /tmp/viz.log

      - name: Photograph the window
        # The count above says the panel tessellated something. It cannot say
        # the window is not black, the panel is not off-screen, or the volume
        # is not hidden behind it. So CI takes an actual picture and uploads
        # it, because that is the only check with eyes -- and because assuming
        # a headless container could not take one is what kept this untested
        # for as long as it was.
        run: |
          sudo apt-get install -y --no-install-recommends x11-apps
          python3 -m pip install --quiet --break-system-packages pillow
          xvfb-run -a --server-args="-screen 0 900x700x24" bash -c '
            cargo viz --scene cavity --extent 48 --steps 4 --warmup 600 \
              --exit-after 3000 --size 880x680 >/dev/null 2>&1 &
            viewer=$!
            sleep 25
            xwd -root -silent > /tmp/window.xwd
            kill $viewer 2>/dev/null || true
            wait 2>/dev/null || true'
          python3 .github/scripts/xwd-to-png.py /tmp/window.xwd frames/window.png

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-frames-and-window
          path: frames/

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets --all-features
