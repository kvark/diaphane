[package]
name = "diaphane"
description = "Real-time 3D electrodynamics: a GPU FDTD solver you watch rather than post-process"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/kvark/diaphane"
keywords = ["electromagnetics", "fdtd", "simulation", "gpu"]
categories = ["science", "simulation", "graphics"]
# `cargo run --features viz` means the window.
default-run = "diaphane-viz"

[features]
default = []
serde = ["dep:ron", "dep:serde"]
# The visualizer. Not on by default, so depending on the solver never drags in
# a window system: the library half has to stay runnable headless, in CI and
# embedded elsewhere.
viz = ["serde", "dep:png", "dep:winit"]

[dependencies]
blade-graphics = "0.8"
blade-macros = "0.3"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
png = { version = "0.18", optional = true }
ron = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
winit = { version = "0.30", optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The only 3D FDTD solver published on crates.io, and so the ecosystem baseline
# the `ecosystem` benchmark measures against.
# Its default feature set is the only one that builds: the prelude reaches for
# modules that a narrower selection configures out.
oxiphoton = "0.1"

# Mirrors the lint configuration of `blade-graphics`, which this project
# follows for coding conventions. The comments are theirs.
[lints.rust]
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"

[lints.clippy]
# We don't use syntax sugar where it's not necessary.
match_like_matches_macro = "allow"
# Redundant matching is more explicit.
redundant_pattern_matching = "allow"
# Explicit lifetimes are often easier to reason about.
needless_lifetimes = "allow"
# No need for defaults in the internal types.
new_without_default = "allow"
# Matches are good and extendable, no need to make an exception here.
single_match = "allow"
# Push commands are more regular than macros.
vec_init_then_push = "allow"
# Let me decide when it's too many.
too_many_arguments = "allow"
# We don't match on a reference, unless required.
pattern_type_mismatch = "warn"

# The viewer needs a display; the renderer writes PNGs and does not. They share
# the render pass and nothing else, so they are two targets rather than one
# binary with a mode switch.
[[bin]]
name = "diaphane-viz"
required-features = ["viz"]

[[bin]]
name = "diaphane-render"
required-features = ["viz"]

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "ecosystem"
harness = false

[profile.release]
debug = 1
