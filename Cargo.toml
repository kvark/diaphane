[package]
name = "diaphane"
description = "Real-time 3D electrodynamics: a GPU FDTD solver you watch rather than post-process"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/kvark/diaphane"
keywords = ["electromagnetics", "fdtd", "simulation", "gpu"]
categories = ["science", "simulation", "graphics"]
# The published crate is the solver: the docs, the CI plumbing and above all
# the README's animation stay out of the tarball, which they would otherwise
# dominate -- the GIF alone is 1.5 MB. The README reaches the animation by
# absolute URL for the same reason.
exclude = ["/docs", "/.github"]

# docs.rs builds with default features unless told otherwise, and the scene
# I/O behind `serde` is exactly the API someone reading the docs needs to see.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Scene files. Optional because the solver does not need to read one to run,
# but this is library API -- `Scene` is the interchange format -- so it is a
# feature rather than something only the examples can reach.
serde = ["dep:ron", "dep:serde"]

# Everything a consumer of the solver links. There is deliberately no window
# system here, under any feature: the visualizer is an example, so `winit` and
# `png` are dev-dependencies and cannot reach a dependency graph that includes
# this crate. CI asserts that with `--all-features`, which is also what docs.rs
# is told to build with, in the metadata above.
[dependencies]
blade-graphics = "0.8"
blade-macros = "0.3"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
ron = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
blade-egui = "0.8.1"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# Depending on ourselves turns `serde` on for the examples, tests and benches
# without turning it on for anyone else: a bare `cargo build` still resolves to
# the four dependencies above, while `cargo test` covers the scene format.
diaphane = { path = ".", features = ["serde"] }
egui = "0.34"
egui-winit = "0.34"
gif = "0.14.2"
# The only 3D FDTD solver published on crates.io, and so the ecosystem baseline
# the `ecosystem` benchmark measures against.
# Its default feature set is the only one that builds: the prelude reaches for
# modules that a narrower selection configures out.
oxiphoton = "0.1"
png = "0.18"
winit = "0.30"

# Mirrors the lint configuration of `blade-graphics`, which this project
# follows for coding conventions. The comments are theirs.
[lints.rust]
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"

[lints.clippy]
# We don't use syntax sugar where it's not necessary.
match_like_matches_macro = "allow"
# Redundant matching is more explicit.
redundant_pattern_matching = "allow"
# Explicit lifetimes are often easier to reason about.
needless_lifetimes = "allow"
# No need for defaults in the internal types.
new_without_default = "allow"
# Matches are good and extendable, no need to make an exception here.
single_match = "allow"
# Push commands are more regular than macros.
vec_init_then_push = "allow"
# Let me decide when it's too many.
too_many_arguments = "allow"
# We don't match on a reference, unless required.
pattern_type_mismatch = "warn"

# The viewer needs a display; the renderer writes PNGs and does not. They share
# the render pass and nothing else, so they are two targets rather than one
# program with a mode switch. Spelled out rather than left to discovery only
# for `test`, which is off by default for examples -- the shared command-line
# parsing has unit tests, and they should run.
[[example]]
name = "viz"
path = "examples/viz/main.rs"
test = true

[[example]]
name = "render"
path = "examples/render/main.rs"
test = true

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "ecosystem"
harness = false

[profile.release]
debug = 1
